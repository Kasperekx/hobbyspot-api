services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: hobbyspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hobbyspot_backend_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hobbyspot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hobbyspot_postgres_data:
